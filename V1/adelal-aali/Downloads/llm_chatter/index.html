<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered translation application">
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
    <title>AI Translation App</title>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="container max-w-4xl mx-auto" role="main">
        <h1 class="text-4xl font-bold text-center mb-8" id="app-title">Translation App</h1>
        

        <div id="translation-form-container" class="hidden">
            <h2 class="text-2xl font-bold mb-4">Translate Text</h2>
        <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
            <form id="translation-form" class="space-y-6" aria-labelledby="app-title">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="source-language" class="block text-sm font-medium mb-2">Source Language</label>
                        <select id="source-language" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base" aria-required="true">
                            <option value="auto">Detect Language</option>
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Russian">Russian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Korean">Korean</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>
                    <div>
                        <label for="target-language" class="block text-sm font-medium mb-2">Target Language</label>
                        <select id="target-language" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base" aria-required="true">
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Russian">Russian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Korean">Korean</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="source-text" class="block text-sm font-medium mb-2">Text to Translate</label>
                    <textarea id="source-text" rows="5" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base" 
                        placeholder="Enter text to translate..." aria-required="true" maxlength="5000"></textarea>
                    <div class="text-right text-sm text-gray-500 mt-1" id="char-count">0/5000</div>
                </div>

                <div>
                    <fieldset>
                        <legend class="block text-sm font-medium mb-2">Translation Model</legend>
                        <div class="flex flex-col sm:flex-row gap-4">
                            <label class="flex items-center space-x-2 p-3 border rounded-md cursor-pointer bg-white border-gray-300 hover:border-blue-500">
                                <input type="radio" name="model" value="Claude-3.7-Sonnet" checked class="text-blue-500 focus:ring-blue-500">
                                <span>Claude-3.7-Sonnet</span>
                            </label>
                            <label class="flex items-center space-x-2 p-3 border rounded-md cursor-pointer bg-white border-gray-300 hover:border-blue-500">
                                <input type="radio" name="model" value="Gemini-2.0-Pro" class="text-blue-500 focus:ring-blue-500">
                                <span>Gemini-2.0-Pro</span>
                            </label>
                        </div>
                    </fieldset>
                </div>

                <button type="submit" class="w-full py-2 px-4 rounded-md text-lg font-medium transition-colors bg-blue-600 hover:bg-blue-700 text-white">
                    Translate
                </button>
            </form>
        </div>
        
        <div id="loading" class="hidden bg-white rounded-lg shadow-lg p-8 text-center" aria-live="polite">
            <div class="flex justify-center items-center space-x-2">
                <div class="animate-spin rounded-full h-6 w-6 border-t-2 border-b-2 loading-spinner" aria-hidden="true"></div>
                <p>Translating... This may take a moment.</p>
            </div>
        </div>
        
        <div id="result-container" class="hidden bg-white rounded-lg shadow-lg p-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold">Translation Result</h2>
                <button id="copy-button" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Copy to Clipboard
                </button>
            </div>
            <div id="translation-result" class="bg-gray-50 p-4 rounded-md whitespace-pre-wrap" aria-live="polite"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
