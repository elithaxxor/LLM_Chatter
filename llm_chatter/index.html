<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="container max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-8">Translation App</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-8 mb-8">
            <form id="translation-form" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="source-language" class="block text-sm font-medium">Source Language</label>
                        <select id="source-language" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base">
                            <option value="auto">Detect Language</option>
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Russian">Russian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Korean">Korean</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>
                    <div>
                        <label for="target-language" class="block text-sm font-medium">Target Language</label>
                        <select id="target-language" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base">
                            <option value="English">English</option>
                            <option value="Spanish">Spanish</option>
                            <option value="French">French</option>
                            <option value="German">German</option>
                            <option value="Italian">Italian</option>
                            <option value="Portuguese">Portuguese</option>
                            <option value="Russian">Russian</option>
                            <option value="Japanese">Japanese</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Korean">Korean</option>
                            <option value="Arabic">Arabic</option>
                        </select>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium">Select AI Model</label>
                    <div class="flex flex-col sm:flex-row gap-4">
                        <label class="flex items-center space-x-2 p-3 border rounded-md cursor-pointer bg-white border-gray-300 hover:border-blue-500">
                            <input type="radio" name="model" value="Claude-3.7-Sonnet" checked class="text-blue-500 focus:ring-blue-500">
                            <span>Claude-3.7-Sonnet</span>
                        </label>
                        <label class="flex items-center space-x-2 p-3 border rounded-md cursor-pointer bg-white border-gray-300 hover:border-blue-500">
                            <input type="radio" name="model" value="Gemini-2.0-Pro" class="text-blue-500 focus:ring-blue-500">
                            <span>Gemini-2.0-Pro</span>
                        </label>
                    </div>
                </div>
                
                <div>
                    <label for="source-text" class="block text-sm font-medium">Text to Translate</label>
                    <textarea id="source-text" rows="5" class="w-full px-4 py-2 rounded-md border border-gray-300 bg-white text-base" placeholder="Enter text to translate..."></textarea>
                </div>
                
                <button type="submit" class="w-full py-2 px-4 rounded-md text-lg font-medium transition-colors">
                    Translate
                </button>
            </form>
        </div>
        
        <div id="loading" class="hidden bg-white rounded-lg shadow-lg p-8 text-center">
            <div class="flex justify-center items-center space-x-2">
                <div class="animate-spin rounded-full h-6 w-6 border-t-2 border-b-2 loading-spinner"></div>
                <p>Translating... This may take a moment.</p>
            </div>
        </div>
        
        <div id="result-container" class="hidden bg-white rounded-lg shadow-lg p-8">
            <h2 class="text-2xl font-bold mb-4">Translation Result</h2>
            <div id="translation-result" class="bg-gray-50 p-4 rounded-md whitespace-pre-wrap"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
